name: Link

on:
  push:
    paths:
      - 'data/detected/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: link-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  link:
    name: Link
    runs-on: ubuntu-latest
    steps:
      - name: Log workflow start
        run: |
          echo "::group::Workflow Metadata"
          echo "workflow_name=link"
          echo "run_id=${{ github.run_id }}"
          echo "run_number=${{ github.run_number }}"
          echo "event_name=${{ github.event_name }}"
          echo "ref=${{ github.ref_name }}"
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "::endgroup::"
          echo "WORKFLOW_START=$(date +%s)" >> $GITHUB_ENV

      - name: Checkout
        run: echo "STEP_START=$(date +%s)" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log checkout duration
        run: |
          DURATION=$(($(date +%s) - $STEP_START))
          echo "::notice::step=checkout duration_seconds=$DURATION"

      - name: Set up Python
        run: echo "STEP_START=$(date +%s)" >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Log Python setup duration
        run: |
          DURATION=$(($(date +%s) - $STEP_START))
          echo "::notice::step=setup_python duration_seconds=$DURATION"

      - name: Install dependencies
        run: |
          STEP_START=$(date +%s)
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pip install -e .
          DURATION=$(($(date +%s) - $STEP_START))
          echo "::notice::step=install_dependencies duration_seconds=$DURATION"

      - name: Ensure branch checkout
        run: git checkout -B "${GITHUB_REF_NAME}"

      - name: Run document linking
        run: |
          STEP_START=$(date +%s)
          python -c "
          import sys
          import json
          import time
          from pathlib import Path
          sys.path.insert(0, 'src')
          from mandate_pipeline.linking import (
              link_documents,
              annotate_linkage,
              detect_superseded_proposals,
              derive_origin_from_symbol,
              is_resolution,
              is_proposal,
              classify_symbol,
          )

          total_start = time.time()
          metrics = {'step': 'link'}

          detected_dir = Path('data/detected')
          extracted_dir = Path('data/extracted')
          linked_dir = Path('data/linked')
          linked_dir.mkdir(parents=True, exist_ok=True)

          # ------------------------------------------------------------------
          # 1. Load detected documents (symbol + signals)
          # ------------------------------------------------------------------
          print('::group::Load Documents')
          load_start = time.time()

          detected_by_stem = {}
          if detected_dir.exists():
              for f in detected_dir.glob('*.json'):
                  with open(f) as fh:
                      detected_by_stem[f.stem] = json.load(fh)

          # ------------------------------------------------------------------
          # 2. Merge with extracted metadata (title, paragraphs, refs, agenda)
          # ------------------------------------------------------------------
          extracted_by_stem = {}
          if extracted_dir.exists():
              for f in extracted_dir.glob('*.json'):
                  with open(f) as fh:
                      extracted_by_stem[f.stem] = json.load(fh)

          documents = []
          for stem, det in detected_by_stem.items():
              symbol = det['symbol']
              ext = extracted_by_stem.get(stem, {})

              doc = {
                  'symbol': symbol,
                  'doc_type': classify_symbol(symbol),
                  'title': ext.get('title', ''),
                  'paragraphs': ext.get('paragraphs', {}),
                  'agenda_items': ext.get('agenda_items', []),
                  'symbol_references': ext.get('symbol_references', []),
                  'signals': det.get('signals', {}),
                  'signal_summary': det.get('signal_summary', {}),
              }
              documents.append(doc)

          load_duration = time.time() - load_start
          metrics['documents_loaded'] = len(documents)
          metrics['load_duration_seconds'] = round(load_duration, 2)
          print(f'Loaded {len(documents)} documents ({len(detected_by_stem)} detected, {len(extracted_by_stem)} extracted)')
          print('::endgroup::')

          # ------------------------------------------------------------------
          # 3. Run real linking (symbol refs + fuzzy title matching)
          # ------------------------------------------------------------------
          print('::group::Link Documents')
          link_start = time.time()

          link_documents(documents, use_undl_metadata=False)
          annotate_linkage(documents)
          detect_superseded_proposals(documents, extracted_dir)

          adopted_count = len([d for d in documents if d.get('is_adopted_draft')])
          superseded_count = len([d for d in documents if d.get('is_superseded')])
          link_duration = time.time() - link_start
          metrics['link_duration_seconds'] = round(link_duration, 2)
          metrics['adopted_drafts'] = adopted_count
          metrics['superseded'] = superseded_count
          print(f'Linked in {link_duration:.2f}s: {adopted_count} adopted, {superseded_count} superseded')
          print('::endgroup::')

          # ------------------------------------------------------------------
          # 4. Derive origin and write linked JSON files
          # ------------------------------------------------------------------
          print('::group::Write Linked Files')
          write_start = time.time()
          doc_type_counts = {'resolution': 0, 'proposal': 0, 'other': 0}

          for doc in documents:
              symbol = doc['symbol']
              doc_type = doc.get('doc_type', 'other')
              doc_type_counts[doc_type] = doc_type_counts.get(doc_type, 0) + 1

              linked_doc = {
                  'symbol': symbol,
                  'doc_type': doc_type,
                  'title': doc.get('title', ''),
                  'paragraphs': doc.get('paragraphs', {}),
                  'signals': doc.get('signals', {}),
                  'signal_summary': doc.get('signal_summary', {}),
                  'symbol_references': doc.get('symbol_references', []),
                  'agenda_items': doc.get('agenda_items', []),
                  'is_adopted_draft': doc.get('is_adopted_draft', False),
                  'adopted_by': doc.get('adopted_by'),
                  'is_superseded': doc.get('is_superseded', False),
                  'superseded_by': doc.get('superseded_by'),
                  'linked_proposals': doc.get('linked_proposals', []),
              }

              output_file = linked_dir / f'{symbol.replace(\"/\", \"_\")}.json'
              with open(output_file, 'w') as f:
                  json.dump(linked_doc, f, indent=2)

          write_duration = time.time() - write_start
          print(f'Wrote {len(documents)} files in {write_duration:.2f}s')
          print('::endgroup::')

          metrics['documents_linked'] = len(documents)
          metrics['resolutions'] = doc_type_counts.get('resolution', 0)
          metrics['proposals'] = doc_type_counts.get('proposal', 0)
          metrics['other'] = doc_type_counts.get('other', 0)
          metrics['total_duration_seconds'] = round(time.time() - total_start, 2)

          # Write metrics to file for shell to read
          with open('/tmp/link_metrics.txt', 'w') as f:
              f.write(f'documents_loaded={metrics[\"documents_loaded\"]}\n')
              f.write(f'documents_linked={len(documents)}\n')
              f.write(f'resolutions={doc_type_counts.get(\"resolution\", 0)}\n')
              f.write(f'proposals={doc_type_counts.get(\"proposal\", 0)}\n')
              f.write(f'other={doc_type_counts.get(\"other\", 0)}\n')
              f.write(f'adopted_drafts={adopted_count}\n')
              f.write(f'superseded={superseded_count}\n')

          print('::group::Linking Metrics')
          for key, value in metrics.items():
              print(f'{key}={value}')
          print('::endgroup::')
          "

          # Read metrics into env vars
          if [ -f /tmp/link_metrics.txt ]; then
            while IFS='=' read -r key value; do
              echo "LINK_${key^^}=$value" >> $GITHUB_ENV
            done < /tmp/link_metrics.txt
          fi

          DURATION=$(($(date +%s) - $STEP_START))
          echo "LINK_STEP_DURATION=$DURATION" >> $GITHUB_ENV
          echo "::notice::step=link duration_seconds=$DURATION"

      - name: Commit linking results
        run: |
          STEP_START=$(date +%s)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/linked/

          LINKED_SIZE=$(du -sh data/linked 2>/dev/null | cut -f1 || echo "0")
          LINKED_COUNT=$(ls -1 data/linked/*.json 2>/dev/null | wc -l || echo 0)
          echo "LINKED_SIZE=$LINKED_SIZE" >> $GITHUB_ENV
          echo "LINKED_COUNT=$LINKED_COUNT" >> $GITHUB_ENV

          if git diff --staged --quiet; then
            echo "COMMIT_RESULT=no_changes" >> $GITHUB_ENV
            echo "::notice::step=commit result=no_changes"
          else
            FILES_CHANGED=$(git diff --staged --numstat | wc -l)
            echo "COMMIT_RESULT=pushed" >> $GITHUB_ENV
            echo "FILES_CHANGED=$FILES_CHANGED" >> $GITHUB_ENV
            git commit -m "chore: link related documents"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
            echo "::notice::step=commit result=pushed files_changed=$FILES_CHANGED"
          fi
          DURATION=$(($(date +%s) - $STEP_START))
          echo "COMMIT_DURATION=$DURATION" >> $GITHUB_ENV

      - name: Write workflow summary
        if: always()
        run: |
          TOTAL_DURATION=$(($(date +%s) - $WORKFLOW_START))

          cat >> $GITHUB_STEP_SUMMARY << 'SUMMARY_EOF'
          ## 🔗 Link Workflow Summary

          **Run:** #${{ github.run_number }} | **Trigger:** `${{ github.event_name }}`
          SUMMARY_EOF

          cat >> $GITHUB_STEP_SUMMARY << EOF

          ### ✨ What Was Linked

          | Documents Processed | **${LINK_DOCUMENTS_LINKED:-0}** |
          |---------------------|--------------------------------|

          ### 📁 Document Types Found

          | Type | Count |
          |------|-------|
          | 📜 Resolutions | **${LINK_RESOLUTIONS:-0}** |
          | 📝 Proposals   | **${LINK_PROPOSALS:-0}** |
          | 📄 Other       | ${LINK_OTHER:-0} |

          ### 📊 Current Totals

          | Metric | Count |
          |--------|-------|
          | Total Linked Files | ${LINKED_COUNT:-0} |
          | Data Size | ${LINKED_SIZE:-N/A} |

          ### 📤 Result

          | Outcome | Status |
          |---------|--------|
          | Commit | ${COMMIT_RESULT:-N/A} |
          | Files Changed | ${FILES_CHANGED:-0} |

          <details>
          <summary>⏱️ Performance</summary>

          | Step | Duration |
          |------|----------|
          | Linking | ${LINK_STEP_DURATION:-N/A}s |
          | Commit | ${COMMIT_DURATION:-N/A}s |
          | **Total** | **${TOTAL_DURATION}s** |

          </details>

          ---
          *Completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)*
          EOF

          echo "::notice::workflow=link docs=${LINK_DOCUMENTS_LINKED:-0} resolutions=${LINK_RESOLUTIONS:-0} proposals=${LINK_PROPOSALS:-0} duration=${TOTAL_DURATION}s"
